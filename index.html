<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doguito</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      opacity: 1;
      transition: opacity 350ms ease;
    }
    img.fade { opacity: 0; }
  </style>
</head>
<body>
  <img id="dog" alt="Foto de um cachorro">
  <script>
    const image = document.getElementById("dog");

    async function nextDog() {
      try {
        const response = await fetch("https://dog.ceo/api/breeds/image/random");
        if (!response.ok) throw new Error("Falha ao buscar imagem");

        const data = await response.json();
        if (data.status !== "success" || !data.message) {
          throw new Error("Resposta inválida da API");
        }

        const preload = new Image();
        preload.onload = () => {
          image.classList.add("fade");
          setTimeout(() => {
            image.src = preload.src;
            image.classList.remove("fade");
          }, 350);
        };
        preload.onerror = () => console.error("Não foi possível carregar a foto.");
        preload.src = data.message;
      } catch (error) {
        console.error("Erro ao carregar cachorro:", error);
      }
    }

    nextDog();
    setInterval(nextDog, 5000);
  </script>
</body>
</html>
