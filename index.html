<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doguito</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
    }
    body {
      display: grid;
      place-items: center;
    }
    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 1;
      transition: opacity 350ms ease;
    }
    img.fade { opacity: 0; }
  </style>
</head>
<body>
  <img id="dog" alt="Foto de um cachorro">
  <script>
    const image = document.getElementById("dog");

    function nextDog() {
      const next = new Image();
      next.onload = () => {
        image.classList.add("fade");
        setTimeout(() => {
          image.src = next.src;
          image.classList.remove("fade");
        }, 350);
      };
      next.onerror = () => setTimeout(nextDog, 1000);
      next.src = "https://dog.ceo/api/breeds/image/random?refresh=" + Date.now();
    }

    nextDog();
    setInterval(nextDog, 5000);
  </script>
</body>
</html>
