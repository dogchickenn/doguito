<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff8ef" />
  <title>Doguito — um cachorro a cada 5 segundos</title>
  <meta name="description" content="Uma dose de fofura: descubra um cachorro aleatório a cada cinco segundos." />
  <link rel="preconnect" href="https://dog.ceo" />
  <link rel="preconnect" href="https://images.dog.ceo" />
  <style>
    :root {
      color-scheme: light;
      --ink: #28231f;
      --muted: #766d65;
      --orange: #f47745;
      --cream: #fff8ef;
      --line: #f0e5d9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, #ffe5cf 0, transparent 27rem),
        radial-gradient(circle at 90% 85%, #fce7d9 0, transparent 25rem),
        var(--cream);
      font-family: ui-rounded, "Avenir Next", Avenir, system-ui, -apple-system, sans-serif;
      display: grid; place-items: center; padding: 28px 16px;
    }
    .page { width: min(100%, 760px); text-align: center; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 13px; border: 1px solid var(--line); border-radius: 999px;
      background: #ffffffb8; color: var(--muted); font-size: 12px;
      font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 8px; font-size: clamp(2.6rem, 8vw, 5rem); line-height: .98; letter-spacing: -.065em; }
    h1 span { color: var(--orange); }
    .intro { margin: 0 auto 26px; max-width: 440px; color: var(--muted); line-height: 1.6; }
    .photo-shell {
      position: relative; width: min(100%, 620px); aspect-ratio: 4 / 3;
      margin: 0 auto; padding: 10px; border-radius: 30px;
      background: #fff; box-shadow: 0 24px 70px #6d49301c, 0 3px 12px #6d493010;
      border: 1px solid #ffffff;
    }
    .photo-shell img {
      width: 100%; height: 100%; display: block; object-fit: cover;
      border-radius: 22px; background: #f5eee7;
      transition: opacity .25s ease;
    }
    .photo-shell img.loading { opacity: .35; }
    .photo-tag {
      position: absolute; left: 24px; bottom: 24px;
      background: #fffdf7ed; padding: 9px 13px; border-radius: 999px;
      font-size: 12px; font-weight: 800; box-shadow: 0 3px 12px #00000012;
    }
    .controls { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; margin: 22px 0 14px; }
    button {
      border: 0; border-radius: 999px; padding: 13px 21px; cursor: pointer;
      font: inherit; font-weight: 800; transition: transform .15s, box-shadow .15s;
    }
    button:hover { transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid #28231f; outline-offset: 3px; }
    .primary { color: white; background: var(--orange); box-shadow: 0 8px 18px #f4774538; }
    .secondary { color: var(--ink); background: white; border: 1px solid var(--line); }
    .status { min-height: 24px; color: var(--muted); font-size: 13px; }
    .status strong { color: var(--ink); }
    footer { margin-top: 30px; color: #978b80; font-size: 12px; }
    footer a { color: inherit; }
    @media (max-width: 520px) {
      .photo-shell { aspect-ratio: 1 / 1; padding: 7px; border-radius: 23px; }
      .photo-shell img { border-radius: 17px; }
      .photo-tag { left: 17px; bottom: 17px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="eyebrow">🐾 pausa para fofura</div>
    <h1>Dog<span>uito</span></h1>
    <p class="intro">Um cachorro aleatório para alegrar o seu dia. Uma nova carinha aparece automaticamente a cada 5 segundos!</p>

    <section class="photo-shell" aria-label="Foto de cachorro aleatório">
      <img id="dog-photo" alt="Um cachorro aleatório" />
      <div class="photo-tag">🐶 <span id="photo-number">Preparando a fofura…</span></div>
    </section>

    <div class="controls">
      <button class="primary" id="next-button" type="button">Outro cachorro 🐾</button>
      <button class="secondary" id="toggle-button" type="button" aria-pressed="false">⏸ Pausar</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">Buscando o primeiro cachorro…</div>

    <footer>Fotos aleatórias fornecidas pela <a href="https://dog.ceo/dog-api/" target="_blank" rel="noopener noreferrer">Dog CEO API</a>.</footer>
  </main>

  <script>
    const photo = document.getElementById("dog-photo");
    const status = document.getElementById("status");
    const numberLabel = document.getElementById("photo-number");
    const nextButton = document.getElementById("next-button");
    const toggleButton = document.getElementById("toggle-button");

    let count = 0;
    let timer = null;
    let paused = false;
    let requestInProgress = false;

    async function showRandomDog() {
      if (requestInProgress) return;
      requestInProgress = true;
      photo.classList.add("loading");
      status.textContent = "Procurando uma nova fofura…";

      try {
        const response = await fetch("https://dog.ceo/api/breeds/image/random", { cache: "no-store" });
        if (!response.ok) throw new Error("Não foi possível carregar uma foto.");
        const data = await response.json();
        if (data.status !== "success" || !data.message) throw new Error("A API não retornou uma foto.");

        const newImage = new Image();
        newImage.onload = () => {
          photo.src = data.message;
          photo.classList.remove("loading");
          count += 1;
          numberLabel.textContent = `Cachorro #${count}`;
          status.innerHTML = "Próxima fofura em <strong>5 segundos</strong>.";
          requestInProgress = false;
        };
        newImage.onerror = () => {
          photo.classList.remove("loading");
          status.textContent = "Essa foto não carregou. Tente novamente.";
          requestInProgress = false;
        };
        newImage.src = data.message;
      } catch (error) {
        photo.classList.remove("loading");
        status.textContent = "Ops! Não conseguimos buscar a foto. Verifique sua conexão.";
        requestInProgress = false;
      }
    }

    function startTimer() {
      clearInterval(timer);
      timer = setInterval(showRandomDog, 5000);
    }

    nextButton.addEventListener("click", showRandomDog);
    toggleButton.addEventListener("click", () => {
      paused = !paused;
      if (paused) {
        clearInterval(timer);
        toggleButton.textContent = "▶ Continuar";
        toggleButton.setAttribute("aria-pressed", "true");
        status.textContent = "Apresentação pausada. Clique em continuar quando quiser.";
      } else {
        toggleButton.textContent = "⏸ Pausar";
        toggleButton.setAttribute("aria-pressed", "false");
        showRandomDog();
        startTimer();
      }
    });

    showRandomDog();
    startTimer();
  </script>
</body>
</html>
